<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הצבעות אוורדס - יורופוסטמה 7</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .glass-panel {
            background: rgba(35, 18, 50, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(249, 115, 22, 0.25);
        }
        .select-custom {
            background-color: rgba(22, 10, 32, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.4);
        }
        .select-custom:focus {
            border-color: #f97316;
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.4);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-8 px-4 relative overflow-x-hidden">

    <!-- אפקטי תאורה ברקע -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -top-[15%] -left-[10%] w-[55%] h-[55%] bg-purple-600/25 blur-[130px] rounded-full"></div>
        <div class="absolute top-[45%] -right-[10%] w-[55%] h-[55%] bg-orange-600/25 blur-[130px] rounded-full"></div>
    </div>

    <div class="max-w-2xl mx-auto glass-panel rounded-3xl shadow-2xl p-6 md:p-8">
        <header class="text-center mb-8">
            <div class="inline-block px-3 py-1 bg-gradient-to-r from-orange-500/20 to-purple-500/20 rounded-full border border-orange-500/30 text-xs text-orange-300 font-bold tracking-wider mb-2">
                EUROPOSTMA 7 AWARDS
            </div>
            <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-pink-500 to-purple-400 mb-2 drop-shadow-md">
                יורופוסטמה 7 🏆
            </h1>
            <p class="text-purple-200/80 text-sm md:text-base font-medium mb-3">
                בחרו שיר לכל קטגוריה. כל מדינה יכולה להיבחר <strong>עד 3 פעמים</strong>!
            </p>
            <div class="inline-block px-4 py-2 bg-orange-950/60 border border-orange-500/30 rounded-xl text-orange-200 text-sm md:text-base font-bold shadow-lg">
                ⏳ שימו לב: הצבעות האוורדס מסתיימות יחד עם סגירת הצבעות הגמר!
            </div>
        </header>

        <form id="votingForm" class="space-y-5">
            <div id="categoriesContainer" class="space-y-4"></div>

            <div id="errorMessage" class="text-orange-300 text-sm text-center hidden font-bold bg-orange-950/70 p-3 rounded-xl border border-orange-500/40"></div>

            <div class="pt-4">
                <button type="submit" class="w-full py-4 px-4 bg-gradient-to-r from-orange-500 via-pink-600 to-purple-600 hover:from-orange-400 hover:to-purple-500 text-white font-black text-lg rounded-xl shadow-[0_0_20px_rgba(249,115,22,0.35)] hover:shadow-[0_0_25px_rgba(168,85,247,0.5)] transition-all duration-300 flex items-center justify-center gap-3 cursor-pointer transform hover:-translate-y-0.5">
                    <span>שליחת ההצבעה לוואטסאפ</span>
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                </button>
            </div>
        </form>

        <!-- מסך אישור -->
        <div id="successMessage" class="hidden text-center py-10 space-y-5">
            <div class="text-6xl animate-bounce">🎉</div>
            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-purple-400">ההצבעה מוכנה!</h2>
            <p class="text-purple-200">אם וואטסאפ לא נפתח אוטומטית, לחץ כאן לשליחה:</p>
            
            <a id="whatsappDirectBtn" href="#" target="_blank" class="inline-flex items-center justify-center w-full py-4 px-6 bg-gradient-to-r from-orange-500 to-purple-600 hover:from-orange-400 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg transition-all text-lg">
                פתח וואטסאפ לשליחה 🚀
            </a>
        </div>
    </div>

    <script>
        // מספר הטלפון אליו יישלחו ההצבעות
        const TARGET_PHONE = "972587493170";

        // רשימת השירים המלאה של יורופוסטמה 7 (נוסף isNQ למדינות שלא עלו לגמר)
        const songsList = [
            { id: "MY", country: "מלזיה", flag: "🇲🇾", song: "TEMBERANG", artist: "MIMIFLY", lang: "foreign" },
            { id: "IT", country: "איטליה", flag: "🇮🇹", song: "autentico", artist: "Nuvola", lang: "foreign" },
            { id: "DE", country: "גרמניה", flag: "🇩🇪", song: "Need For Speed", artist: "Kim Petras", lang: "english", isNQ: true },
            { id: "RU", country: "רוסיה", flag: "🇷🇺", song: "вампиры", artist: "забей, лерочка", lang: "foreign", isNQ: true },
            { id: "MX", country: "מקסיקו", flag: "🇲🇽", song: "BODY HORROR", artist: "DeathbyRomy", lang: "english" },
            { id: "EE", country: "אסטוניה", flag: "🇪🇪", song: "Armastatuna", artist: "INGER", lang: "foreign", isNQ: true },
            { id: "TR", country: "טורקיה", flag: "🇹🇷", song: "CRUSH!", artist: "CRUSH", lang: "foreign" },
            { id: "TN", country: "תוניסיה", flag: "🇹🇳", song: "Soirée mondaine", artist: "Oria", lang: "foreign" },
            { id: "PR", country: "פוארטו ריקו", flag: "🇵🇷", song: "DJesus", artist: "Magdalene", lang: "foreign" },
            { id: "IL", country: "ישראל", flag: "🇮🇱", song: "יש בי אהבה", artist: "נתניהו ועדן בן זקן", lang: "foreign", isNQ: true },
            { id: "CA", country: "קנדה", flag: "🇨🇦", song: "Sober Motel", artist: "Dilly Dally", lang: "english" },
            { id: "ME", country: "מונטנגרו", flag: "🇲🇪", song: "MOKRA BLUZA", artist: "TEODORA ŠĆEPANOVIĆ", lang: "foreign" },
            { id: "KR", country: "דרום קוריאה", flag: "🇰🇷", song: "Goofy", artist: "James the Seventh", lang: "english" },
            { id: "US", country: "ארה״ב", flag: "🇺🇸", song: "TRUST!", artist: "Rebecca Black", lang: "english", isNQ: true },
            { id: "TH", country: "תאילנד", flag: "🇹🇭", song: "Move", artist: "Saint Motel", lang: "english", isNQ: true },
            { id: "MT", country: "מלטה", flag: "🇲🇹", song: "TAMA", artist: "Gaia Cauchi", lang: "foreign" },
            { id: "UA", country: "אוקראינה", flag: "🇺🇦", song: "PELIGROSO", artist: "NK", lang: "foreign", isNQ: true },
            { id: "LB", country: "לבנון", flag: "🇱🇧", song: "NOT ALL LOVE IS DEATH", artist: "Gina Dirawi", lang: "english" },
            { id: "PG", country: "פפואה ניו גיני", flag: "🇵🇬", song: "DRUM", artist: "Emmi", lang: "english" },
            { id: "CH", country: "שוויץ", flag: "🇨🇭", song: "Tamara Samsonova", artist: "SKYND", lang: "english" },
            { id: "PS", country: "פלסטין", flag: "🇵🇸", song: "Bosa", artist: "Elyanna", lang: "foreign" },
            { id: "GB", country: "בריטניה", flag: "🇬🇧", song: "Keep Talking", artist: "Just For Fun", lang: "english" },
            { id: "MA", country: "מרוקו", flag: "🇲🇦", song: "זהרה", artist: "גל ג'ומה ואסולין", lang: "foreign" },
            { id: "FR", country: "צרפת", flag: "🇫🇷", song: "TILT", artist: "ari hicks", lang: "english" },
            { id: "JP", country: "יפן", flag: "🇯🇵", song: "Frontiers", artist: "Awich", lang: "foreign", isNQ: true },
            { id: "SK", country: "סלובקיה", flag: "🇸🇰", song: "SLOVENKA", artist: "EMILY", lang: "foreign" },
            { id: "FI", country: "פינלנד", flag: "🇫🇮", song: "Missio", artist: "BESS", lang: "foreign", isNQ: true }
        ];

        // הקטגוריות עם התיאורים החדשים (נוסף filterNQ לקטגוריית השדידה)
        const categories = [
            { id: 'best_english', name: '🇬🇧 השיר הכי טוב באנגלית', desc: 'השיר הבולט ביותר מתוך השירים שמושרים באנגלית', filterLang: 'english' },
            { id: 'best_foreign', name: '🌍 השיר הכי טוב בשפה זרה', desc: 'השיר המצטיין שמושר בשפת המקור שלו', filterLang: 'foreign' },
            { id: 'best_vocals', name: '🎤 הווקאלס הכי טובים', desc: 'הביצוע הקולי המרשים והעוצמתי ביותר' },
            { id: 'best_video', name: '🎬 הקליפ הכי טוב', desc: 'הקליפ עם הויזואליה, העריכה והסיפור המרתקים ביותר' },
            { id: 'most_original', name: '🦄 השיר הכי מקורי', desc: 'השיר שהביא סגנון חדש ורענן שלא שומעים כל יום' },
            { id: 'best_lyrics', name: '✍️ המילים הכי טובות באנגלית', desc: 'הטקסט הכי מרגש או מתוחכם (לשירים באנגלית בלבד)', filterLang: 'english' },
            { id: 'best_grower', name: '🌱 השיר שהכי גדל עליכם', desc: 'השיר שבהתחלה פחות התחברתם אליו ועכשיו אתם חורשים עליו' },
            { id: 'best_recap', name: '🎞️ הריקאפ הכי טוב', desc: 'השיר שבלט במיוחד בלקט ההצבעות' },
            { id: 'best_banger', name: '💃 הבאנגר של העונה', desc: 'השיר שהכי מרים וגורם לכם לרצות לרקוד' },
            { id: 'best_intro', name: '🍿 האינטרו הכי טוב', desc: 'האינטרו שגורם לכם לתדהמה כל פעם מחדש' },
            { id: 'biggest_robbery', name: '💰 השדידה הכי גדולה', desc: 'השיר שכל כך הגיע לו להיות בגמר (לשירים שלא העפילו בלבד)', filterNQ: true }
        ];

        const container = document.getElementById('categoriesContainer');
        const form = document.getElementById('votingForm');
        const errorDiv = document.getElementById('errorMessage');

        // רנדור השאלות
        function renderForm() {
            container.innerHTML = '';
            categories.forEach(cat => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col gap-1.5 bg-purple-950/20 p-4 rounded-2xl border border-purple-800/30';
                
                const label = document.createElement('label');
                label.className = 'block text-sm md:text-base font-bold text-orange-200 pr-1';
                label.innerText = cat.name;

                // הוספת התיאור מתחת לכותרת הקטגוריה
                const desc = document.createElement('p');
                desc.className = 'text-xs md:text-sm text-purple-300/80 pr-1 mb-1 font-medium';
                desc.innerText = cat.desc;

                const select = document.createElement('select');
                select.name = cat.id;
                select.className = 'select-custom w-full rounded-xl p-3 text-slate-100 focus:outline-none transition-all shadow-inner font-medium text-sm md:text-base';

                const defaultOpt = document.createElement('option');
                defaultOpt.value = "";
                defaultOpt.innerText = "-- בחר מדינה / שיר --";
                defaultOpt.disabled = true;
                defaultOpt.selected = true;
                select.appendChild(defaultOpt);

                songsList.forEach(item => {
                    // סינון לפי שפה אם מוגדר בקטגוריה
                    if (cat.filterLang && item.lang !== cat.filterLang) {
                        return;
                    }
                    
                    // סינון לשירים שלא עלו לגמר (NQ) אם מוגדר בקטגוריה
                    if (cat.filterNQ && !item.isNQ) {
                        return;
                    }

                    const opt = document.createElement('option');
                    // הערך שנשמר
                    opt.value = `${item.flag} ${item.country}: ${item.song}`;
                    // הטקסט שמוצג בתפריט
                    opt.innerText = `${item.flag} ${item.country} | ${item.song} (${item.artist})`;
                    opt.dataset.countryId = item.id;
                    select.appendChild(opt);
                });

                select.addEventListener('change', updateOptionsAvailability);

                wrapper.appendChild(label);
                wrapper.appendChild(desc); // הוספת אלמנט התיאור לטופס
                wrapper.appendChild(select);
                container.appendChild(wrapper);
            });
        }

        // נעילת מדינות שנבחרו בקטגוריות אחרות
        const MAX_PER_COUNTRY = 3;
        
        // נעילת מדינות שנבחרו כבר 3 פעמים בקטגוריות אחרות
        function updateOptionsAvailability() {
            const selects = document.querySelectorAll('select');
        
            // ספירת כמה פעמים נבחרה כל מדינה
            const counts = {};
            selects.forEach(s => {
                const selectedOpt = s.options[s.selectedIndex];
                const id = selectedOpt && selectedOpt.dataset.countryId;
                if (id) counts[id] = (counts[id] || 0) + 1;
            });
        
            selects.forEach(select => {
                const currentSelectedOpt = select.options[select.selectedIndex];
                const currentCountryId = currentSelectedOpt ? currentSelectedOpt.dataset.countryId : null;
        
                Array.from(select.options).forEach(opt => {
                    const countryId = opt.dataset.countryId;
                    if (!countryId) return; // התעלמות מאופציית הדיפולט
        
                    // נעילה רק אם המדינה הגיעה למקסימום, והיא לא הבחירה הנוכחית של התפריט הזה
                    const isFull = (counts[countryId] || 0) >= MAX_PER_COUNTRY && countryId !== currentCountryId;
        
                    opt.disabled = isFull;
                    opt.style.color = isFull ? '#6b7280' : '#f1f5f9';
                });
            });
        }

        // שליחת הטופס לוואטסאפ
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');

            const selects = document.querySelectorAll('select');
            let allSelected = true;
            const votes = [];

            selects.forEach(select => {
                if (!select.value) {
                    allSelected = false;
                } else {
                    const categoryObj = categories.find(c => c.id === select.name);
                    votes.push({
                        category: categoryObj.name,
                        selection: select.value
                    });
                }
            });

            if (!allSelected) {
                errorDiv.innerText = "חובה לבחור מדינה לכל הקטגוריות לפני השליחה!";
                errorDiv.classList.remove('hidden');
                errorDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            // יצירת הודעת וואטסאפ מעוצבת
            let textMessage = `🏆 *ההצבעות שלי - יורופוסטמה 7:* \n\n`;
            votes.forEach(v => {
                textMessage += `${v.category}\n⬅️ *${v.selection}*\n\n`;
            });

            const encodedText = encodeURIComponent(textMessage);
            const whatsappUrl = `https://api.whatsapp.com/send?phone=${TARGET_PHONE}&text=${encodedText}`;

            document.getElementById('whatsappDirectBtn').href = whatsappUrl;
            window.open(whatsappUrl, '_blank');

            form.classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
        });

        renderForm();
    </script>
</body>
</html>
